<mat-sidenav-container class="shell-container">

  <mat-sidenav mode="side" opened class="sidenav">
    <div class="brand">
      <span class="brand-name">ARABAZON</span>
      <span class="brand-sub">Trade AI</span>
    </div>

    <mat-nav-list>
      <a mat-list-item
         *ngFor="let item of navItems"
         [routerLink]="item.route"
         routerLinkActive="active-link">
        <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
        <span matListItemTitle>{{ item.label }}</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="main-content">
    <mat-toolbar class="toolbar">
      <span class="toolbar-title">ARABAZON Trade AI</span>
      <span class="spacer"></span>

      <button mat-icon-button
              [matMenuTriggerFor]="notifMenu"
              (click)="clearNotifications()">
        <mat-icon
          [matBadge]="unreadCount"
          [matBadgeHidden]="unreadCount === 0"
          matBadgeColor="warn"
          matBadgeSize="small">
          notifications
        </mat-icon>
      </button>
    </mat-toolbar>

    <mat-menu #notifMenu="matMenu" class="notif-menu">
      <div class="notif-header">Notifications</div>
      <div *ngIf="notifications.length === 0" class="notif-empty">
        No notifications yet
      </div>
      <div *ngFor="let n of notifications.slice(0, 10)"
           class="notif-item" mat-menu-item>
        <div class="notif-title">{{ n.title }}</div>
        <div class="notif-body">{{ n.message }}</div>
        <div class="notif-time">{{ n.timestamp | date:'HH:mm:ss' }}</div>
      </div>
    </mat-menu>

    <div class="page-content">
      <router-outlet></router-outlet>
    </div>
  </mat-sidenav-content>

</mat-sidenav-container>
